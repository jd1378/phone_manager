name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # deno desktop needs 2.9.6+ to put the deno.json version into installers.
  DENO_VERSION: 2.9.7

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true
      - name: Check that the tag matches the deno.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(jq -r .version deno.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match deno.json version $version"
            exit 1
          fi
      - run: deno install --frozen
      - run: deno task check
      - run: deno task test

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows packages cross-build on Linux. macOS needs a macOS host for
          # iconutil, hdiutil (.dmg) and codesign.
          - runner: ubuntu-latest
            targets: linux-x64 linux-arm64 windows-x64
          - runner: macos-latest
            targets: macos-arm64 macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true
      - run: deno install --frozen
      - run: deno task package ${{ matrix.targets }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ runner.os }}
          path: build/phone-manager-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: Write checksums
        working-directory: release
        run: sha256sum phone-manager-* > SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY" --title "Phone Manager $GITHUB_REF_NAME" --generate-notes
